<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI for a Better Life</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#05060f;--tx:#eaf2ff;--mut:#9fb0d0;--cy:#22d3ee;--vi:#8b5cf6;--gl:rgba(14,18,40,.55);--bd:rgba(120,160,255,.22);--g1:rgba(34,211,238,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse at 72% 45%,var(--g1),transparent 60%),radial-gradient(ellipse at 10% 100%,rgba(139,92,246,.2),transparent 55%),var(--bg);transition:background .8s}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 12px var(--cy);transition:width .7s cubic-bezier(.2,.8,.2,1);z-index:5}
#p{position:fixed;left:5vw;top:50%;transform:translateY(-50%);width:min(480px,90vw);padding:28px 30px;background:var(--gl);border:1px solid var(--bd);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 60px rgba(139,92,246,.15),inset 0 0 30px rgba(34,211,238,.05);z-index:3}
#p>*{animation:in .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.28em;color:var(--cy);margin-bottom:12px;text-transform:uppercase}
h1{font-size:clamp(1.8rem,4vw,3.2rem);line-height:1.05;font-weight:700;background:linear-gradient(100deg,#fff,#7dd3fc 45%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(34,211,238,.25)}
.sub{margin-top:14px;font-size:1.1rem;color:#cfe3ff;font-weight:500}
.d{margin-top:12px;color:var(--mut);line-height:1.55;font-size:.98rem}
ul{list-style:none;margin-top:18px;padding:0;display:grid;gap:10px}
li{position:relative;padding-left:24px;color:#d6e4ff;font-size:.98rem;line-height:1.4;animation:in .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--i)*.09s)}
li::before{content:"";position:absolute;left:0;top:.45em;width:9px;height:9px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy),0 0 22px var(--vi)}
#go{margin-top:22px;padding:15px 30px;border:0;border-radius:99px;font:700 .95rem "Space Grotesk",system-ui,sans-serif;letter-spacing:.2em;color:#05060f;background:linear-gradient(100deg,var(--cy),var(--vi),#d946ef);background-size:200% 100%;cursor:pointer;animation:in .8s .6s both,pulse 2.4s infinite,slide 4s linear infinite;box-shadow:0 0 30px rgba(34,211,238,.5)}
@keyframes pulse{50%{box-shadow:0 0 55px rgba(139,92,246,.85)}}
@keyframes slide{to{background-position:200% 0}}
#nav{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--gl);border:1px solid var(--bd);border-radius:99px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:4}
#nav button{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--tx);transition:.25s}
#nav button:hover{background:rgba(34,211,238,.18);box-shadow:0 0 16px rgba(34,211,238,.5)}
#nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dots{display:flex;gap:7px;align-items:center}
#dots button{width:10px;height:10px;background:rgba(160,180,230,.3);border-radius:99px}
#dots button.on{width:28px;background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 12px var(--cy)}
#cnt{font-size:.85rem;color:var(--mut);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
@media(max-width:760px){
#p{left:3vw;right:3vw;width:auto;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:none;max-height:46vh;overflow:auto;padding:18px 20px;border-radius:20px}
h1{font-size:1.6rem}.sub{font-size:.98rem}ul{gap:7px;margin-top:12px}li,.d{font-size:.88rem}
#nav{gap:4px;padding:6px 8px}#nav button{width:34px;height:34px}#dots{gap:5px}#dots button{width:8px;height:8px}#dots button.on{width:20px}#fs{display:none}}
</style>
</head>
<body>
<div id="bar"></div>
<canvas id="c"></canvas>
<div id="p"></div>
<div id="nav">
<button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
<div id="dots"></div><span id="cnt">1 / 7</span>
<button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
<button id="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),PI=Math.PI;
const K={c:0x22d3ee,v:0x8b5cf6,m:0xd946ef,g:0x4ade80,o:0xfbbf24,b:0x60a5fa,r:0xfb7185};
const add=T.AdditiveBlending;
const lm=(c,o=.9)=>new T.LineBasicMaterial({color:c,transparent:true,opacity:o,blending:add,depthWrite:false});
const sm=(c,o=.15)=>new T.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:add,depthWrite:false,side:T.DoubleSide});
const W=(g,c,o,e)=>new T.LineSegments(e?new T.EdgesGeometry(g):new T.WireframeGeometry(g),lm(c,o));
function M(g,c,{e=0,o=.85,f=.1}={}){const r=new T.Group();r.add(W(g,c,o,e),new T.Mesh(g,sm(c,f)));return r}
const BG=a=>{const g=new T.BufferGeometry();g.setAttribute("position",new T.BufferAttribute(new Float32Array(a),3));return g};
const P=(a,c,s)=>new T.Points(BG(a),new T.PointsMaterial({color:c,size:s,transparent:true,opacity:.9,blending:add,depthWrite:false}));
const L=(a,c,o)=>new T.LineSegments(BG(a),lm(c,o));
function C(r,c,o=.6){const a=[];for(let i=0;i<=96;i++){const t=i/96*PI*2;a.push(Math.cos(t)*r,0,Math.sin(t)*r)}return new T.Line(BG(a),lm(c,o))}
const at=(o,x,y,z)=>{o.position.set(x,y,z);return o};
function body(){const g=new T.Group(),m=(geo,x,y,z,rz)=>{const o=M(geo,K.c,{f:.07});o.position.set(x,y,z);o.rotation.z=rz||0;g.add(o)};
m(new T.SphereGeometry(.22,12,8),0,1.05,0);m(new T.CylinderGeometry(.3,.25,.9,10),0,.4,0);
for(const s of[-1,1]){m(new T.CylinderGeometry(.08,.07,.8,6),s*.46,.4,0,s*.12);m(new T.CylinderGeometry(.12,.1,.95,6),s*.15,-.55,0)}return g}

/* ---- scenes ---- */
function s1(){const g=new T.Group(),p=[],q=[],N=650;
for(let i=0;i<N;i++){const u=R(-1,1),t=R(0,PI*2),k=Math.sqrt(1-u*u),x=k*Math.cos(t),z=k*Math.sin(t),f=1+.07*Math.sin(x*9)*Math.sin(u*8+z*7);p.push(x*1.5*f+(x>0?.05:-.05),u*1.05*f,z*1.2*f)}
for(let i=0;i<N;i++)for(let j=0;j<3;j++){const k=(i+1+Math.floor(R(0,40)))%N,dx=p[i*3]-p[k*3],dy=p[i*3+1]-p[k*3+1],dz=p[i*3+2]-p[k*3+2];if(dx*dx+dy*dy+dz*dz<.12)q.push(p[i*3],p[i*3+1],p[i*3+2],p[k*3],p[k*3+1],p[k*3+2])}
const br=new T.Group();br.add(P(p,K.c,.045),L(q,K.v,.4));g.add(br);
const rs=[2.2,2.7,3.2].map((r,i)=>{const c=C(r,i?K.v:K.c,.6);c.rotation.set(R(.2,1.2),0,R(.2,1.2));g.add(c);return c});
const ui=[];for(let i=0;i<5;i++){const o=M(new T.PlaneGeometry(.7,.45),i%2?K.v:K.c,{e:1,f:.12});g.add(o);ui.push(o)}
g.u=t=>{br.rotation.y=t*.25;br.scale.setScalar(1+.025*Math.sin(t*2));rs.forEach((c,i)=>c.rotation.y=t*(.15+i*.08));ui.forEach((o,i)=>{const a=t*.4+i*1.256,r=3;o.position.set(Math.cos(a)*r,Math.sin(t+i)*.6+(i-2)*.3,Math.sin(a)*r);o.lookAt(0,o.position.y,0)})};return g}

function s2(){const g=new T.Group(),h=new T.Group();
h.add(M(new T.BoxGeometry(1.8,1.1,1.5),K.c,{e:1}));
const r=M(new T.ConeGeometry(1.5,.8,4),K.v,{e:1,f:.18});r.position.y=.95;r.rotation.y=PI/4;h.add(r);
h.add(at(M(new T.BoxGeometry(.3,.55,.02),K.m,{e:1,f:.3}),0,-.27,.76));
h.add(at(M(new T.PlaneGeometry(.4,.35),K.o,{e:1,f:.35}),-.55,.1,.76),at(M(new T.PlaneGeometry(.4,.35),K.o,{e:1,f:.35}),.55,.1,.76));
g.add(at(h,0,.2,0),at(C(2.1,K.c,.8),0,-.6,0),at(C(2.7,K.v,.5),0,-.6,0));
const gs=[new T.SphereGeometry(.2,8,6),new T.OctahedronGeometry(.25),new T.TorusGeometry(.18,.06,6,12),new T.TetrahedronGeometry(.28),new T.IcosahedronGeometry(.22)];
const ic=gs.map((geo,i)=>{const o=M(geo,[K.c,K.m,K.g,K.o,K.b][i],{f:.25});g.add(o);return o});
g.u=t=>{h.rotation.y=t*.3;h.position.y=.2+Math.sin(t)*.08;ic.forEach((o,i)=>{const a=t*.5+i*1.256,r=2.5;o.position.set(Math.cos(a)*r,Math.sin(t*1.2+i)*.5+.5,Math.sin(a)*r);o.rotation.x=t;o.rotation.y=t*.7})};return g}

function s3(){const g=new T.Group(),b=body();b.scale.setScalar(1.15);g.add(b);
const sc=C(1,K.c,1);g.add(sc);const sp=new T.Mesh(new T.CircleGeometry(1,40),sm(K.c,.1));sp.rotation.x=-PI/2;sc.add(sp);
const ht=M(new T.SphereGeometry(.12,10,8),K.r,{f:.5});ht.position.set(.12,.65,.2);g.add(ht);
g.add(at(C(1.3,K.v,.8),0,-1.6,0),at(C(1.8,K.c,.5),0,-1.6,0));
const cr=new T.Group();cr.add(M(new T.BoxGeometry(.7,.22,.22),K.g,{e:1,f:.3}),M(new T.BoxGeometry(.22,.7,.22),K.g,{e:1,f:.3}));at(cr,2.2,.9,0);g.add(cr);
const ecg=[];for(let i=0;i<40;i++){const x=-1+i*.05,y=i%10==5?.4:i%10==6?-.25:0;ecg.push(x,y,0,x+.05,i%10==4?.4:i%10==5?-.25:0,0)}
const e=L(ecg,K.r,.9);at(e,-2.4,-.4,0);g.add(e);
const cb=[];for(let i=0;i<6;i++){const o=M(new T.BoxGeometry(.25,.25,.25),i%2?K.v:K.b,{e:1,f:.2});g.add(o);cb.push(o)}
g.u=t=>{b.rotation.y=Math.sin(t*.4)*.6;sc.position.y=Math.sin(t*.9)*1.5;sc.rotation.y=t;ht.scale.setScalar(1+.35*Math.abs(Math.sin(t*3)));cr.rotation.y=t;e.position.x=-2.4+Math.sin(t)*.1;cb.forEach((o,i)=>{const a=t*.4+i*1.05;o.position.set(Math.cos(a)*2.3,Math.sin(t+i*2)*.9,Math.sin(a)*2.3);o.rotation.set(t,t,0)})};return g}

function s4(){const g=new T.Group(),a=new T.Group();
a.add(at(M(new T.SphereGeometry(.5,16,12),K.c,{f:.12}),0,.3,0),at(M(new T.ConeGeometry(.5,.9,12),K.v,{f:.12}),0,-.55,0));
for(const s of[-1,1])a.add(at(M(new T.SphereGeometry(.07,6,6),K.o,{f:.9}),s*.18,.38,.46));
const h=C(.75,K.m,.9);h.position.y=1;a.add(h);g.add(a);
const bk=[];for(let i=0;i<9;i++){const o=M(new T.BoxGeometry(.5,.08,.36),[K.c,K.v,K.m,K.o][i%4],{e:1,f:.25});o.userData=[R(1.6,2.6),R(-.8,1.3),R(0,6)];g.add(o);bk.push(o)}
for(let i=-1;i<=1;i++){const s=M(new T.PlaneGeometry(1.5,.95),K.b,{e:1,f:.08}),ln=[];for(let j=0;j<5;j++)ln.push(-.6,.3-j*.15,0,-.6+R(.4,1.2),.3-j*.15,0);s.add(L(ln,K.c,.7));s.position.set(Math.sin(i*.85)*3.1,.6,-Math.cos(i*.85)*3.1+1);s.rotation.y=-i*.85;g.add(s)}
g.add(at(C(2,K.c,.5),0,-1.2,0));
g.u=t=>{a.position.y=Math.sin(t*1.2)*.1;a.rotation.y=Math.sin(t*.5)*.4;h.rotation.z=t;bk.forEach(o=>{const[r,y,p]=o.userData,q=t*.35+p;o.position.set(Math.cos(q)*r,y+Math.sin(t+p)*.2,Math.sin(q)*r);o.rotation.set(t*.5+p,t*.6,0)})};return g}

function s5(){const g=new T.Group(),bars=[],bg=new T.Group();
for(let i=0;i<3;i++)for(let j=0;j<2;j++){const o=M(new T.BoxGeometry(.4,1,.4),(i+j)%2?K.v:K.c,{e:1,f:.22});bg.add(o);o.position.set(i*.65,0,j*.65);bars.push(o)}
at(bg,-2.2,-1,.2);g.add(bg);
const rb=new T.Group();rb.add(M(new T.BoxGeometry(.7,.8,.5),K.c,{e:1,f:.18}),at(M(new T.SphereGeometry(.3,12,8),K.v,{f:.2}),0,.8,0),at(M(new T.SphereGeometry(.06,6,6),K.o,{f:1}),-.1,.85,.28),at(M(new T.SphereGeometry(.06,6,6),K.o,{f:1}),.1,.85,.28),at(L([0,1.1,0,0,1.4,0],K.m,1),0,0,0),at(M(new T.BoxGeometry(.18,.6,.18),K.c,{e:1}),-.5,.1,0),at(M(new T.BoxGeometry(.18,.6,.18),K.c,{e:1}),.5,.1,0));
at(rb,.4,-.1,0);g.add(rb);
const ds=[];for(const[x,y,z,r]of[[-1.2,1.5,-1,.4],[2,.9,-.8,-.4],[1.6,-1.3,.6,-.3]]){const d=M(new T.PlaneGeometry(1.6,1),K.b,{e:1,f:.1}),ln=[];for(let j=0;j<5;j++){const h=R(.1,.6);ln.push(-.6+j*.3,-.4,0,-.6+j*.3,-.4+h,0)}d.add(L(ln,K.g,.9));d.position.set(x,y,z);d.rotation.y=r;g.add(d);ds.push(d)}
const arc=W(new T.TorusGeometry(.5,.05,6,32,4.2),K.m,.9);at(arc,-.3,1.7,0);g.add(arc);
g.add(at(C(2.8,K.c,.4),0,-1.1,0));
g.u=t=>{bars.forEach((o,i)=>{const h=.4+(Math.sin(t*1.3+i)+1)*.6;o.scale.y=h;o.position.y=h/2});rb.position.y=-.1+Math.sin(t*1.5)*.12;rb.rotation.y=Math.sin(t*.6)*.5;arc.rotation.z=t;ds.forEach((d,i)=>d.position.y+=Math.sin(t+i)*.002)};return g}

function s6(){const g=new T.Group(),pv=new T.Group();
g.add(at(M(new T.CylinderGeometry(.12,.18,3,8),K.v,{f:.15}),0,-.2,0),at(M(new T.CylinderGeometry(1,1.3,.2,24),K.c,{f:.12}),0,-1.8,0),at(C(1.9,K.v,.6),0,-1.9,0));
pv.add(M(new T.BoxGeometry(3.4,.08,.08),K.c,{e:1,f:.5}));at(pv,0,1.3,0);g.add(pv);
function pan(s,obj,y,col){const p=new T.Group();p.add(L([0,0,0,-.55,-1,0,0,0,0,.55,-1,0],K.b,.7),at(M(new T.CylinderGeometry(.62,.62,.05,28),col,{f:.2}),0,-1,0));obj.position.y=y;p.add(obj);p.position.x=s*1.6;pv.add(p);return p}
const ai=M(new T.IcosahedronGeometry(.42,1),K.v,{f:.3}),hm=body();hm.scale.setScalar(.38);hm.children.forEach(c=>c);
const pa=pan(-1,ai,-.5,K.v),ph=pan(1,hm,-.55,K.g);
const hw=[];for(let i=0;i<24;i++){const a=R(0,PI*2),r=R(.5,.9);hw.push(Math.cos(a)*r-1.6,R(.2,1.6),Math.sin(a)*r)}
g.add(P(hw,K.v,.05));
g.u=t=>{const r=.1*Math.sin(t*.8);pv.rotation.z=r;pa.rotation.z=ph.rotation.z=-r;ai.rotation.y=t;ai.rotation.x=t*.6;hm.rotation.y=Math.sin(t*.5)*.6};return g}

function s7(){const g=new T.Group(),tops=[],q=[];
g.add(new T.GridHelper(8,16,K.c,K.v));g.children[0].material.transparent=true;g.children[0].material.opacity=.25;g.children[0].position.y=-1.2;
for(let i=0;i<70;i++){const a=R(0,PI*2),r=R(.9,3.4),h=R(.4,2.4),w=R(.2,.45),gr=Math.random()<.45,o=M(new T.BoxGeometry(w,h,w),gr?K.g:Math.random()<.5?K.c:K.v,{e:1,f:gr?.22:.12});o.position.set(Math.cos(a)*r,h/2-1.2,Math.sin(a)*r);g.add(o);tops.push(o.position.x,h-1.2,o.position.z)}
for(let i=0;i<30;i++){const a=Math.floor(R(0,70))*3,b=Math.floor(R(0,70))*3;q.push(tops[a],tops[a+1],tops[a+2],tops[b],tops[b+1],tops[b+2])}
g.add(L(q,K.m,.35));
const sun=new T.Mesh(new T.CircleGeometry(1,40),sm(K.o,.55));sun.position.set(0,.2,-4.2);g.add(sun,at(new T.Mesh(new T.CircleGeometry(1.8,40),sm(K.m,.12)),0,.2,-4.3));
const cars=[];for(let i=0;i<7;i++){const o=M(new T.BoxGeometry(.28,.07,.13),i%2?K.c:K.o,{e:1,f:.7});o.userData=[R(1.5,3.3),R(.3,2.2),R(0,6),R(.15,.4)];g.add(o);cars.push(o)}
g.u=t=>{sun.scale.setScalar(1+.04*Math.sin(t));cars.forEach(o=>{const[r,y,p,s]=o.userData,a=t*s+p;o.position.set(Math.cos(a)*r,y,Math.sin(a)*r);o.rotation.y=-a})};return g}

/* ---- slides ---- */
const D=[
{t:"Introduction",h:"AI FOR A BETTER LIFE",s:"Building a smarter, easier, and more connected future.",d:"Artificial Intelligence is changing the way we live, work, learn, and communicate. It helps humans solve problems faster and make better decisions.",c:"rgba(34,211,238,.2)"},
{t:"AI in everyday life",h:"AI Is Already Part of Our Lives",i:["Smart assistants and voice recognition","Personalized recommendations","Smart home automation","Navigation and traffic prediction","Translation and communication"],c:"rgba(139,92,246,.22)"},
{t:"AI in healthcare",h:"A Healthier Tomorrow with AI",i:["Helps doctors analyze medical images","Early detection of potential health problems","Personalized healthcare support","Faster medical research","Smart health monitoring"],c:"rgba(251,113,133,.17)"},
{t:"AI in education",h:"Learning Without Limits",i:["Personalized learning experiences","AI-powered learning assistants","Instant explanations of difficult topics","Language translation","Students learn at their own pace"],c:"rgba(251,191,36,.14)"},
{t:"AI in work and business",h:"Work Smarter, Not Harder",i:["Automating repetitive tasks","Improving productivity","Helping businesses understand data","Supporting creativity and innovation","Better customer service with AI chatbots"],c:"rgba(96,165,250,.2)"},
{t:"Challenges and responsible AI",h:"A Powerful Technology Needs Responsibility",i:["Data privacy and security","Misinformation and deepfakes","Bias and unfair decisions","Overdependence on technology","Human supervision and responsible development"],c:"rgba(217,70,239,.2)"},
{t:"The future & conclusion",h:"The Future Is Intelligent",s:"“AI won’t replace the value of being human. It can help us achieve more.”",i:["Smarter cities","Better healthcare","More accessible education","Sustainable technology","Human and AI collaboration"],d:"The goal of AI is not just to create smarter machines, but to create a better life for everyone.",c:"rgba(251,191,36,.2)",b:1}];

/* ---- three setup ---- */
const cv=$("c"),ren=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new T.Scene(),cam=new T.PerspectiveCamera(50,1,.1,100);cam.position.z=8.5;
const root=new T.Group();sc.add(root);
const G=[s1,s2,s3,s4,s5,s6,s7].map(f=>{const g=f();g.scale.setScalar(.001);g.visible=false;root.add(g);return g});
const st=[];for(let i=0;i<1600;i++){const r=R(12,45),a=R(0,PI*2),b=R(-1,1);st.push(Math.cos(a)*r,b*r*.6,Math.sin(a)*r)}
const stars=P(st,0xbcd4ff,.12);sc.add(stars);
const dust=[];for(let i=0;i<150;i++)dust.push(R(-8,8),R(-5,5),R(-4,4));
const dp=P(dust,K.c,.04);sc.add(dp);
let base=1,mx=0,my=0,tx=0,ty=0,cur=0;
function fit(){const w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
if(w<760){root.position.set(0,1.5,0);base=.55}else if(w<1100){root.position.set(1.6,0,0);base=.75}else{root.position.set(2.3,0,0);base=1}}
addEventListener("resize",fit);fit();
addEventListener("pointermove",e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
const clk=new T.Clock();
(function loop(){requestAnimationFrame(loop);const t=clk.getElapsedTime();
mx+=(tx-mx)*.05;my+=(ty-my)*.05;
cam.position.x=mx*1.6;cam.position.y=-my*1.1;cam.lookAt(root.position.x*.4,root.position.y*.5,0);
root.rotation.y=mx*.35;root.rotation.x=my*.2;root.scale.setScalar(base);
stars.rotation.y=t*.01;dp.rotation.y=t*.03;dp.position.x=mx*-1;
G.forEach((g,i)=>{const on=i===cur,s=g.scale.x,n=s+((on?1:.001)-s)*.07;g.scale.setScalar(n);g.visible=n>.02;
if(g.visible){g.position.z=(1-n)*-5;g.rotation.y=(on?0:i<cur?-1:1)*(1-n)*1.2;g.u(t)}});
ren.render(sc,cam)})();

/* ---- UI ---- */
const panel=$("p"),dots=$("dots");
D.forEach((_,i)=>{const b=document.createElement("button");b.setAttribute("aria-label","Slide "+(i+1));b.onclick=()=>go(i);dots.appendChild(b)});
function go(n){n=Math.max(0,Math.min(6,n));cur=n;const s=D[n];
panel.innerHTML=`<span class="tag">0${n+1} — ${s.t}</span><h1>${s.h}</h1>`+(s.s?`<p class="sub">${s.s}</p>`:"")+(s.d&&n===0?`<p class="d">${s.d}</p>`:"")+(s.i?`<ul>${s.i.map((x,i)=>`<li style="--i:${i}">${x}</li>`).join("")}</ul>`:"")+(s.d&&n>0?`<p class="d" style="margin-top:16px;color:#cfe3ff;font-weight:500">${s.d}</p>`:"")+(s.b?`<button id="go">EXPLORE THE FUTURE</button>`:"");
const gb=$("go");if(gb)gb.onclick=()=>go(0);
document.documentElement.style.setProperty("--g1",s.c);
[...dots.children].forEach((d,i)=>d.className=i===n?"on":"");
$("cnt").textContent=(n+1)+" / 7";$("bar").style.width=(n+1)/7*100+"%"}
go(0);
$("prev").onclick=()=>go(cur-1);$("next").onclick=()=>go(cur+1);
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
$("fs").onclick=fs;
addEventListener("keydown",e=>{if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1)}else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}else if(e.key==="f"||e.key==="F")fs()});
let lw=0;addEventListener("wheel",e=>{if(e.target.closest("#p"))return;const n=Date.now();if(n-lw<900||Math.abs(e.deltaY)<20)return;lw=n;go(cur+(e.deltaY>0?1:-1))},{passive:true});
let sx=0,sy=0;addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))go(cur+(dx<0?1:-1))},{passive:true});
</script>
</body>
